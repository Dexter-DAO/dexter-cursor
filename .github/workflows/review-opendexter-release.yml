name: Produce reviewed OpenDexter release evidence

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact protected tag, opendexter-v<package.version>
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: opendexter-release-review-${{ github.sha }}
  cancel-in-progress: false

env:
  OPENDXTER_RELEASE_CONTAINER_IMAGE: node:22.19.0-bookworm@sha256:f2bf1588ef7e8dd183d9e4cb4330a0d952204b7348ead42afb1aab11f9c4911b

jobs:
  prepare:
    name: Freeze inspectable source proposal
    runs-on: ubuntu-24.04
    container:
      image: node:22.19.0-bookworm@sha256:f2bf1588ef7e8dd183d9e4cb4330a0d952204b7348ead42afb1aab11f9c4911b
    defaults:
      run:
        shell: bash
        working-directory: ide
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: sha256:${{ steps.upload.outputs.artifact-digest }}
      artifact_name: ${{ steps.freeze.outputs.proposal_name }}
    steps:
      - name: Check out the exact tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: ide
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Mint repository-scoped read-only release-audit token
        id: audit-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.OPENDXTER_RELEASE_AUDIT_APP_ID }}
          private-key: ${{ secrets.OPENDXTER_RELEASE_AUDIT_APP_PRIVATE_KEY }}
          owner: Dexter-DAO
          repositories: opendexter-ide
          permission-actions: read
          permission-administration: read

      - name: Freeze source proposal and tag protection
        id: freeze
        env:
          GITHUB_TOKEN: ${{ steps.audit-token.outputs.token }}
          OPENDXTER_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -eu
          proposal_root="$RUNNER_TEMP/opendexter-release-proposal"
          node packages/mcp/scripts/github-hosted-release.mjs prepare-review \
            --release-tag "$OPENDXTER_RELEASE_TAG" \
            --output "$proposal_root" \
            --github-output "$GITHUB_OUTPUT"
          test -f "$proposal_root/proposal.json"

      - name: Upload immutable review proposal
        id: upload
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: ${{ steps.freeze.outputs.proposal_name }}
          path: ${{ runner.temp }}/opendexter-release-proposal
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  approve:
    name: Independently approve frozen proposal
    needs: prepare
    runs-on: ubuntu-24.04
    environment: opendexter-release-review
    container:
      image: node:22.19.0-bookworm@sha256:f2bf1588ef7e8dd183d9e4cb4330a0d952204b7348ead42afb1aab11f9c4911b
    defaults:
      run:
        shell: bash
        working-directory: ide
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: sha256:${{ steps.upload.outputs.artifact-digest }}
      artifact_name: ${{ steps.approve.outputs.evidence_name }}
    steps:
      - name: Check out the exact tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: ide
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Mint repository-scoped read-only release-audit token
        id: audit-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.OPENDXTER_RELEASE_AUDIT_APP_ID }}
          private-key: ${{ secrets.OPENDXTER_RELEASE_AUDIT_APP_PRIVATE_KEY }}
          owner: Dexter-DAO
          repositories: opendexter-ide
          permission-actions: read
          permission-administration: read

      - name: Download exact proposal by immutable artifact ID
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: ${{ runner.temp }}/opendexter-release-proposal

      - name: Validate independent approval and produce evidence
        id: approve
        env:
          GITHUB_TOKEN: ${{ steps.audit-token.outputs.token }}
          OPENDXTER_RELEASE_TAG: ${{ inputs.release_tag }}
          OPENDXTER_PROPOSAL_ARTIFACT_ID: ${{ needs.prepare.outputs.artifact_id }}
          OPENDXTER_PROPOSAL_ARTIFACT_DIGEST: ${{ needs.prepare.outputs.artifact_digest }}
        run: |
          set -eu
          evidence_root="$RUNNER_TEMP/opendexter-release-evidence"
          node packages/mcp/scripts/github-hosted-release.mjs approve-review \
            --release-tag "$OPENDXTER_RELEASE_TAG" \
            --proposal "$RUNNER_TEMP/opendexter-release-proposal" \
            --proposal-artifact-id "$OPENDXTER_PROPOSAL_ARTIFACT_ID" \
            --proposal-artifact-digest "$OPENDXTER_PROPOSAL_ARTIFACT_DIGEST" \
            --output "$evidence_root" \
            --github-output "$GITHUB_OUTPUT"
          test -f "$evidence_root/producer-receipt.json"

      - name: Upload one immutable evidence artifact
        id: upload
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: ${{ steps.approve.outputs.evidence_name }}
          path: ${{ runner.temp }}/opendexter-release-evidence
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Record immutable handoff values
        env:
          OPENDXTER_RUN_ID: ${{ github.run_id }}
          OPENDXTER_PROPOSAL_ARTIFACT_ID: ${{ needs.prepare.outputs.artifact_id }}
          OPENDXTER_EVIDENCE_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          OPENDXTER_EVIDENCE_ARTIFACT_DIGEST: sha256:${{ steps.upload.outputs.artifact-digest }}
          OPENDXTER_TAGGED_SHA: ${{ github.sha }}
        run: |
          {
            echo "### OpenDexter release evidence"
            echo
            echo "Run ID: \`$OPENDXTER_RUN_ID\`"
            echo "Proposal artifact ID: \`$OPENDXTER_PROPOSAL_ARTIFACT_ID\`"
            echo "Evidence artifact ID: \`$OPENDXTER_EVIDENCE_ARTIFACT_ID\`"
            echo "Evidence artifact digest: \`$OPENDXTER_EVIDENCE_ARTIFACT_DIGEST\`"
            echo "Tagged SHA: \`$OPENDXTER_TAGGED_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

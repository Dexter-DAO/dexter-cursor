name: Publish OpenDexter package

on:
  push:
    tags:
      - "opendexter-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opendexter-npm-production
  cancel-in-progress: false

env:
  OPENDXTER_RELEASE_CONTAINER_IMAGE: node:22.19.0-bookworm@sha256:f2bf1588ef7e8dd183d9e4cb4330a0d952204b7348ead42afb1aab11f9c4911b
  OPENDXTER_RELEASE_REGISTRY: https://registry.npmjs.org/

jobs:
  build:
    name: Verify source, test, build, and pack once
    runs-on: ubuntu-24.04
    container:
      image: node:22.19.0-bookworm@sha256:f2bf1588ef7e8dd183d9e4cb4330a0d952204b7348ead42afb1aab11f9c4911b
    defaults:
      run:
        shell: bash
        working-directory: ide
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.context.outputs.artifact_name }}
      tarball_sha256: ${{ steps.build.outputs.tarball_sha256 }}
      release_sha256: ${{ steps.build.outputs.release_sha256 }}
      version: ${{ steps.context.outputs.version }}
    steps:
      - name: Check out exact tagged package source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.ref }}
          path: ide
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Fetch canonical main for ancestry verification
        run: |
          set -eu
          git -c credential.helper= fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main

      - name: Freeze tag, version, and source contract
        id: context
        run: |
          set -eu
          node packages/mcp/scripts/github-hosted-release.mjs context \
            --output "$RUNNER_TEMP/opendexter-context.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Check out exact public hosted MCP source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Dexter-DAO/dexter-mcp
          ref: ${{ steps.context.outputs.mcp_commit }}
          path: mcp
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Mint one contents-read token for paired private sources
        id: source-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.OPENDXTER_SOURCE_APP_ID }}
          private-key: ${{ secrets.OPENDXTER_SOURCE_APP_PRIVATE_KEY }}
          owner: Dexter-DAO
          repositories: |-
            dexter-api
            dexter-facilitator
          permission-contents: read

      - name: Check out exact private API source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Dexter-DAO/dexter-api
          ref: ${{ steps.context.outputs.api_commit }}
          path: api
          token: ${{ steps.source-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Check out exact private facilitator source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Dexter-DAO/dexter-facilitator
          ref: ${{ steps.context.outputs.facilitator_commit }}
          path: facilitator
          token: ${{ steps.source-token.outputs.token }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Remove checkout credential surfaces
        run: |
          set -eu
          git -C "$GITHUB_WORKSPACE/api" remote set-url origin \
            https://github.com/Dexter-DAO/dexter-api.git
          git -C "$GITHUB_WORKSPACE/facilitator" remote set-url origin \
            https://github.com/Dexter-DAO/dexter-facilitator.git

      - name: Test, build, and pack the immutable tarball once
        id: build
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          set -eu
          node packages/mcp/scripts/github-hosted-release.mjs build \
            --context "$RUNNER_TEMP/opendexter-context.json" \
            --mcp-root "$GITHUB_WORKSPACE/mcp" \
            --api-root "$GITHUB_WORKSPACE/api" \
            --facilitator-root "$GITHUB_WORKSPACE/facilitator" \
            --output "$RUNNER_TEMP/opendexter-package" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload the exact tarball and receipt
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: ${{ steps.context.outputs.artifact_name }}
          path: ${{ runner.temp }}/opendexter-package
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  publish:
    name: Approve, publish with OIDC, and reconcile
    needs: build
    runs-on: ubuntu-24.04
    environment: opendexter-npm-production
    container:
      image: node:22.19.0-bookworm@sha256:f2bf1588ef7e8dd183d9e4cb4330a0d952204b7348ead42afb1aab11f9c4911b
    defaults:
      run:
        shell: bash
        working-directory: ide
    permissions:
      contents: read
      id-token: write
    env:
      OPENDXTER_RELEASE_ENVIRONMENT: opendexter-npm-production
    steps:
      - name: Check out exact tagged verifier source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.ref }}
          path: ide
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Download the build job artifact by deterministic name
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/opendexter-package

      - name: Verify exact tarball and receipt hashes
        id: package
        run: |
          set -eu
          node packages/mcp/scripts/github-hosted-release.mjs publish-input \
            --bundle "$RUNNER_TEMP/opendexter-package" \
            --tarball-sha256 "${{ needs.build.outputs.tarball_sha256 }}" \
            --release-sha256 "${{ needs.build.outputs.release_sha256 }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Reuse an identical published version on retry
        id: registry
        run: |
          set -eu
          node packages/mcp/scripts/github-hosted-release.mjs registry \
            --mode preflight \
            --bundle "$RUNNER_TEMP/opendexter-package" \
            --tarball-sha256 "${{ needs.build.outputs.tarball_sha256 }}" \
            --release-sha256 "${{ needs.build.outputs.release_sha256 }}" \
            --require-dist-tag false \
            --github-output "$GITHUB_OUTPUT"

      - name: Prepare pinned npm OIDC publisher
        if: steps.registry.outputs.should_publish == 'true'
        id: publisher
        run: |
          set -eu
          test -z "${NODE_AUTH_TOKEN:-}"
          test -z "${NPM_TOKEN:-}"
          node packages/mcp/scripts/github-hosted-release.mjs publisher-npm \
            --output "$RUNNER_TEMP/opendexter-npm-publisher" \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish the exact existing tarball with OIDC
        if: steps.registry.outputs.should_publish == 'true'
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
          NPM_CONFIG_GLOBALCONFIG: /dev/null.opendexter-github-release
          OPENDXTER_NPM_CLI: ${{ steps.publisher.outputs.npm_cli }}
          OPENDXTER_TARBALL: ${{ steps.package.outputs.tarball }}
          OPENDXTER_DIST_TAG: ${{ steps.package.outputs.dist_tag }}
        run: |
          set -eu
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          test -z "${NODE_AUTH_TOKEN:-}"
          test -z "${NPM_TOKEN:-}"
          node "$OPENDXTER_NPM_CLI" publish "$OPENDXTER_TARBALL" \
            --ignore-scripts \
            --provenance \
            --access public \
            --registry "$OPENDXTER_RELEASE_REGISTRY" \
            --strict-ssl=true \
            --tag "$OPENDXTER_DIST_TAG"

      - name: Verify registry integrity and provenance
        env:
          REQUIRE_DIST_TAG: ${{ steps.registry.outputs.should_publish }}
        run: |
          set -eu
          node packages/mcp/scripts/github-hosted-release.mjs registry \
            --mode reconcile \
            --bundle "$RUNNER_TEMP/opendexter-package" \
            --tarball-sha256 "${{ needs.build.outputs.tarball_sha256 }}" \
            --release-sha256 "${{ needs.build.outputs.release_sha256 }}" \
            --require-dist-tag "$REQUIRE_DIST_TAG" \
            --output "$RUNNER_TEMP/opendexter-registry-reconciliation.json"

      - name: Summarize the immutable release
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
          REGISTRY_STATE: ${{ steps.registry.outputs.state }}
        run: |
          {
            echo "### OpenDexter npm release"
            echo
            echo "Package: \`@dexterai/opendexter@$PACKAGE_VERSION\`"
            echo "Preflight: \`$REGISTRY_STATE\`"
            echo "Tarball SHA-256: \`${{ needs.build.outputs.tarball_sha256 }}\`"
            echo "Registry integrity and GitHub OIDC provenance verified."
          } >> "$GITHUB_STEP_SUMMARY"
